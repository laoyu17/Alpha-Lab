task_name: demo_factor_research_minute
data_dir: data/demo
output_dir: outputs
frequency: minute
symbols: [AAA, BBB, CCC, DDD, EEE]
start: "2023-01-03"
end: "2023-01-31"

factors:
  - name: price_smooth_20
    source: close
    operations:
      - op: rolling_mean
        window: 20
      - op: zscore
      - op: winsorize
        lower: 0.05
        upper: 0.95
      - op: neutralize
    fillna: ffill

  - name: volume_decay_10
    source: volume
    operations:
      - op: decay_linear
        window: 10
      - op: rank
      - op: winsorize
      - op: neutralize
    fillna: zero

eval:
  forward_period: 1
  quantiles: 5
  rolling_window: 120
  walk_forward_train: 120
  walk_forward_test: 30
  trading_days_per_year: 252
  periods_per_day: 240

guards:
  enable_future_check: true
  enforce_tradable_filter: true
  limit_move_threshold: 0.095

costs:
  commission_bps: 2.0
  slippage_bps: 5.0

dl:
  enabled: false
  plugin: temporal_mlp_stub
  output_name: dl_alpha
  feature_factors: [price_smooth_20, volume_decay_10]
  params:
    lookback: 12
    momentum_weight: 0.7
    fusion_weight: 0.3
